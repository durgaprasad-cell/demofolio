trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  vmDeployPath: /tmp
  vmPort: 3000

stages:
  - stage: TestAndBuild
    displayName: Test and build image
    jobs:
      - job: TestAndBuild
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: Use Node.js 20

          - script: npm install
            displayName: Install dependencies

          - script: npm test
            displayName: Run tests

          - script: |
              docker build -t demofolio:$(Build.BuildId) .
              docker save -o $(Build.ArtifactStagingDirectory)/demofolio.tar demofolio:$(Build.BuildId)
            displayName: Build and package Docker image

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/demofolio.tar
              artifact: demofolio-image
            displayName: Publish Docker image artifact

  - stage: Deploy
    displayName: Deploy to Azure VM
    dependsOn: TestAndBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToVm
        displayName: Deploy container to VM
        environment: demofolio-vm
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: demofolio-image
                    path: $(Pipeline.Workspace)/image
                  displayName: Download Docker image artifact

                - task: CopyFilesOverSSH@0
                  inputs:
                    sshEndpoint: Linux_deployment
                    sourceFolder: $(Pipeline.Workspace)/image
                    contents: demofolio.tar
                    targetFolder: $(vmDeployPath)
                    overwrite: true
                  displayName: Copy image to Azure VM

                - task: SSH@0
                  inputs:
                    sshEndpoint: Linux_deployment
                    runOptions: inline
                    inline: |
                      docker load -i $(vmDeployPath)/demofolio.tar
                      docker rm -f demofolio || true
                      docker run -d --name demofolio --restart unless-stopped -p $(vmPort):3000 demofolio:$(Build.BuildId)
                      rm -f $(vmDeployPath)/demofolio.tar
                  displayName: Restart DemoFolio container